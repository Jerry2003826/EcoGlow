name: CI

on:
  push:
    branches: [main, jiarui]
  pull_request:
    branches: [main, jiarui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_ecoglow
          MYSQL_USER: my_app
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, pdo_mysql, redis
        ini-values: zend.assertions=1
        coverage: none

    - name: Composer install
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Composer post install
      run: composer run-script post-install-cmd --no-interaction

    - name: Grant MySQL migration privileges
      run: |
        mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"
        mysql -h 127.0.0.1 -uroot -proot -e "GRANT TRIGGER, CREATE ROUTINE, ALTER ROUTINE, CREATE VIEW, CREATE, ALTER, INDEX, REFERENCES, DROP ON test_ecoglow.* TO 'my_app'@'%'; FLUSH PRIVILEGES;"

    - name: Run PHPUnit
      run: vendor/bin/phpunit
      env:
        SECURITY_SALT: f76f1c8475585c46c6acd3ddcb8f5e0f15de524637bb4080a08c4afe7cfc9144
        DATABASE_TEST_URL: mysql://my_app:secret@127.0.0.1:3306/test_ecoglow?encoding=utf8mb4
        CACHE_LOGIN_THROTTLE_URL: redis://127.0.0.1:6379/0

  coding-standard:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.4'
        extensions: mbstring, intl, redis
        coverage: none
        # Pin the exact 2.1.x. debug_kit pulls composer/pcre, which conflicts
        # with phpstan/phpstan as a Composer package, so CI installs the tool.
        tools: cs2pr, phpstan:2.1.56

    - name: Composer install
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Composer validate
      run: composer validate --strict

    - name: Composer audit
      shell: bash
      run: |
        set -o pipefail
        composer audit --locked --abandoned=fail | tee composer-audit.txt

    - name: Upload composer audit
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: composer-audit
        path: composer-audit.txt

    - name: Run PHP CodeSniffer
      shell: bash
      run: |
        set -o pipefail
        vendor/bin/phpcs --report=checkstyle | cs2pr

    - name: Run phpstan
      run: phpstan analyse --no-progress
      env:
        SECURITY_SALT: f76f1c8475585c46c6acd3ddcb8f5e0f15de524637bb4080a08c4afe7cfc9144
